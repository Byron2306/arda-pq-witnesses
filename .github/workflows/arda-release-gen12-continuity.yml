name: ARDA Gen12 boot continuity signature
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: arda-gen12-release-authority
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository_id == '1458361210' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: arda-release-authority
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sign the fixed reviewed Gen12 boot profile
        env:
          ARDA_RELEASE_ENABLED: ${{ vars.ARDA_RELEASE_ENABLED }}
          ARDA_RELEASE_APPROVED_COMMIT: ${{ vars.ARDA_RELEASE_APPROVED_COMMIT }}
          ARDA_GEN12_RELEASE_ED25519_PKCS8_B64: ${{ secrets.ARDA_GEN12_RELEASE_ED25519_PKCS8_B64 }}
          ARDA_GEN12_RELEASE_TEMPLATE_ZLIB_B64: ${{ secrets.ARDA_GEN12_RELEASE_TEMPLATE_ZLIB_B64 }}
          ARDA_GEN12_RELEASE_PUBLIC_PEM_SHA256: ${{ vars.ARDA_GEN12_RELEASE_PUBLIC_PEM_SHA256 }}
          ARDA_GEN12_RELEASE_VALID_HOURS: ${{ vars.ARDA_GEN12_RELEASE_VALID_HOURS }}
        run: |
          /usr/bin/python3 -I -B tools/gen12_release_authority.py sign \
            --output "$RUNNER_TEMP/gen12-continuity.detached.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arda-gen12-boot-continuity-signature
          path: ${{ runner.temp }}/gen12-continuity.detached.json
          if-no-files-found: error
          retention-days: 7

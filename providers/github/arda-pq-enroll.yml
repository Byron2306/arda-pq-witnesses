name: ARDA provider-local key enrollment
on:
  workflow_dispatch:
    inputs:
      ceremony_b64:
        description: Canonical public ceremony encoded as base64
        required: true
        type: string
      ceremony_sha256:
        description: Independently reviewed ceremony digest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arda-pq-key-enrollment
  cancel-in-progress: false
jobs:
  enroll:
    if: ${{ vars.ARDA_ENROLLMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: arda-pq-enrollment
    timeout-minutes: 10
    steps:
      - name: Validate immutable setup image, approved workflow commit and ceremony
        shell: bash
        env:
          ARDA_WITNESS_IMAGE: ${{ vars.ARDA_WITNESS_IMAGE }}
          ARDA_APPROVED_ENROLLMENT_COMMIT: ${{ vars.ARDA_APPROVED_ENROLLMENT_COMMIT }}
          ARDA_CEREMONY_B64: ${{ inputs.ceremony_b64 }}
          ARDA_CEREMONY_PIN: ${{ inputs.ceremony_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re
          image=os.environ['ARDA_WITNESS_IMAGE']
          assert re.fullmatch(r'ghcr.io/byron2306/arda-pq-witness@sha256:[0-9a-f]{64}',image)
          assert re.fullmatch('[0-9a-f]{40}',os.environ['ARDA_APPROVED_ENROLLMENT_COMMIT'])
          assert os.environ['GITHUB_SHA']==os.environ['ARDA_APPROVED_ENROLLMENT_COMMIT']
          assert os.environ['GITHUB_REPOSITORY']=='Byron2306/arda-pq-witnesses'
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          pin=os.environ['ARDA_CEREMONY_PIN'];assert re.fullmatch('[0-9a-f]{64}',pin)
          encoded=os.environ['ARDA_CEREMONY_B64'];assert len(encoded)<=24000
          raw=base64.b64decode(encoded,validate=True);assert len(raw)<=16384
          assert hashlib.sha256(raw).hexdigest()==pin
          data=json.loads(raw)
          assert json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()==raw
          assert data['image_digest']==image.split('@')[1]
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'arda-enrollment'
          root.mkdir(mode=0o700);(root/'out').mkdir(mode=0o700)
          (root/'ceremony.json').write_bytes(raw)
          PY
      - name: Generate and store GitHub key; release public registration only
        shell: bash
        env:
          ARDA_WITNESS_IMAGE: ${{ vars.ARDA_WITNESS_IMAGE }}
          ARDA_ALLOW_PROVIDER_KEY_PROVISIONING: ${{ inputs.ceremony_sha256 }}
          ARDA_ENROLLMENT_STORE_TOKEN: ${{ secrets.ARDA_ENROLLMENT_STORE_TOKEN }}
        run: |
          set -euo pipefail
          export ARDA_IMAGE_DIGEST="${ARDA_WITNESS_IMAGE##*@}"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --env ARDA_ALLOW_PROVIDER_KEY_PROVISIONING --env ARDA_ENROLLMENT_STORE_TOKEN --env ARDA_IMAGE_DIGEST \
            --env GITHUB_ACTIONS --env GITHUB_REPOSITORY \
            --mount "type=bind,src=$RUNNER_TEMP/arda-enrollment/ceremony.json,dst=/ceremony.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/arda-enrollment/out,dst=/output" \
            "$ARDA_WITNESS_IMAGE" python3 tools/enroll_provider.py --provider github \
              --ceremony /ceremony.json --ceremony-sha256 "$ARDA_ALLOW_PROVIDER_KEY_PROVISIONING" \
              --out /output/github-registration.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arda-github-public-key-registration
          path: ${{ runner.temp }}/arda-enrollment/out/github-registration.json
          if-no-files-found: error
          retention-days: 1
